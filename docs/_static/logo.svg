<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 284" width="320" height="284" role="img" aria-label="yetanotherspdnet logo">
  <title>yetanotherspdnet</title>
  <!-- same visual language as the spdnet-datasets logo: an orange orbit and a
       curved sheet (the SPD manifold); here the matrices travelling through
       the network are drawn as ellipses on the sheet, linked by a geodesic -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6a46a"/>
      <stop offset="0.55" stop-color="#eb6834"/>
      <stop offset="1" stop-color="#be542a"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be542a"/>
      <stop offset="1" stop-color="#8f3d1d"/>
    </linearGradient>
  </defs>
  <!-- orbit -->
  <path d="M 52 70 A 128 128 0 0 1 272 66" fill="none" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <path d="M 280 200 A 128 128 0 0 1 64 214" fill="none" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <circle cx="52" cy="70" r="13" fill="#eb6834"/>
  <circle cx="280" cy="200" r="13" fill="#eb6834"/>
  <!-- manifold sheet -->
  <path d="M 30 196 C 80 120, 120 70, 170 74 C 220 78, 250 130, 292 168 C 250 176, 200 196, 168 230 C 120 214, 70 204, 30 196 Z" fill="url(#sheet)"/>
  <path d="M 30 196 C 70 204, 120 214, 168 230 C 170 238, 160 246, 150 244 C 110 232, 60 214, 30 196 Z" fill="url(#under)"/>
  <!-- grid lines on the sheet -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
    <path d="M 64 176 C 100 128, 140 100, 180 104 C 220 110, 246 140, 270 164"/>
    <path d="M 98 200 C 128 160, 160 140, 196 146 C 226 152, 244 166, 252 172"/>
    <path d="M 92 140 C 110 170, 124 198, 128 218"/>
    <path d="M 140 92 C 150 136, 158 180, 162 226"/>
    <path d="M 200 86 C 204 120, 208 150, 212 196"/>
  </g>
  <!-- geodesic through three SPD matrices drawn as ellipses -->
  <path d="M 84 180 C 120 150, 170 128, 236 146" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#8f3d1d" stroke-width="2.5">
    <ellipse cx="84" cy="180" rx="22" ry="9" transform="rotate(-35 84 180)"/>
    <ellipse cx="158" cy="136" rx="17" ry="11" transform="rotate(-10 158 136)"/>
    <ellipse cx="236" cy="146" rx="13" ry="13"/>
  </g>
</svg>

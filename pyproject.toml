[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yetanotherspdnet"
version = "0.1.0"
description = "A robust and tested implementation of SPDNet learning models for Symmetric Positive Definite matrices"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ammar Mian", email = "ammar.mian@univ-smb.fr"},
    {name = "Florent Bouchard"},
    {name = "Guillaume Ginolhac"},
    {name = "Matthieu Gallet"},
]
keywords = [
    "deep-learning",
    "pytorch",
    "spd-matrices",
    "riemannian-geometry",
    "spdnet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "scipy>=1.11.0",
]
dev = [
    # keep in sync with .github/workflows/tests.yml and .pre-commit-config.yaml
    "ruff==0.16.7",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
docs = [
    "sphinx>=7.2.0",
    "myst-parser>=2.0.0",
    "linkify-it-py>=2.0.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    # docs/_diagrams/make_diagrams.py (regenerates the figures of docs/_static)
    "numpy>=1.24",
    "matplotlib>=3.7",
]
all = [
    "yetanotherspdnet[test,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/Yet-Another-Research-Organisation/yetanotherspdnet"
Documentation = "https://yet-another-research-organisation.github.io/yetanotherspdnet"
Repository = "https://github.com/Yet-Another-Research-Organisation/yetanotherspdnet"
Issues = "https://github.com/Yet-Another-Research-Organisation/yetanotherspdnet/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=yetanotherspdnet",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=40",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source_pkgs = ["yetanotherspdnet"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Ruff Configuration (Linting + Formatting)
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "NPY",    # NumPy-specific rules
    "T20",    # flake8-print: no print() in library code
    "D",      # pydocstyle (numpy convention, see below)
    "N",      # pep8-naming
    "PLR",    # pylint refactor
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
    "E731",   # Lambda functions
    "PLR0913", "PLR0917",  # layers and models expose every hyper-parameter as an argument
    "PLR2004",  # magic values: comparisons are ndim == 2 (a single matrix) checks
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
# mathematical notation: matrices are upper case (X, G_inv), SPD / BW suffixes,
# and the manual-backward twin of an operation is its CamelCase name
# (AffineInvariantMean, a function chaining torch.autograd.Function classes)
"src/**" = ["N802", "N803", "N806", "N816"]
"src/yetanotherspdnet/model.py" = ["PLR0915"]  # constructors building every layer
# tests: test names / docstrings are not API documentation
"tests/*" = ["ARG", "S101", "D", "N", "PLR"]
"docs/*" = ["D", "N"]
"docs/_diagrams/*" = ["T20", "D", "N", "PLR", "RUF001"]  # script printing the files it writes; typographic dashes in figure titles

[tool.ruff.lint.isort]
known-first-party = ["yetanotherspdnet"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# MyPy Configuration (Type Checking)
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
